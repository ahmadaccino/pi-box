appId: works.earendil.pi-box
productName: pi-box
copyright: MIT
asar: true
files:
  - main.mjs
  - preload.mjs
  - logic.mjs
extraResources:
  - from: ../bin
    to: bin
  - from: ../container
    to: container
    filter:
      - "**/*.mjs"
      - models.json
      - package.json
  - from: ../plugins
    to: plugins
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # Raspberry Pi stays on `pi-box node`. Do not ship a Linux arm64 Electron GUI.
directories:
  output: dist
