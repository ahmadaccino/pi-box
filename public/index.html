<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi-box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="gate" hidden>
      <div class="gate-card">
        <span class="mark"></span>
        <h1>pi-box</h1>
        <p id="gate-copy">Sign in to message your boxes.</p>
        <form id="pwform" hidden>
          <input type="password" id="pw" autocomplete="current-password" placeholder="Password" />
          <button type="submit">Continue</button>
        </form>
        <p id="pwerr" class="gate-err" hidden>Wrong password</p>
        <button type="button" id="signin" hidden>Sign in</button>
      </div>
    </div>
    <div id="app" class="app" hidden>
      <aside>
        <div class="aside-head">
          <div class="brand">
            <span class="mark"></span>
            <strong>pi-box</strong>
          </div>
          <div class="aside-actions">
            <button type="button" id="newchat" class="ghost" title="New chat">New</button>
            <button type="button" id="userbtn" class="ghost" title="Account">you</button>
          </div>
        </div>
        <p class="aside-label">chats</p>
        <nav id="roster"></nav>
        <div id="skill-list" class="skill-list"></div>
        <footer class="aside-foot">
          <a href="/vault">vault</a>
        </footer>
      </aside>
      <section class="thread">
        <header>
          <div>
            <strong id="box-name">select a chat</strong>
            <span class="sub" id="box-meta"></span>
          </div>
          <div class="status" id="status">idle</div>
        </header>
        <div id="computer-pane" hidden></div>
        <main id="log"></main>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="Message this box…"></textarea>
          <button type="submit" id="send">Send</button>
        </form>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
    <script src="/computer.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
