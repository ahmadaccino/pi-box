<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi-box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
  </head>
  <body>
    <div id="gate" hidden>
      <div class="gate-card">
        <span class="mark"></span>
        <h1>pi-box</h1>
        <p id="gate-copy">Sign in to message your boxes.</p>
        <form id="pwform" hidden>
          <input type="password" id="pw" autocomplete="current-password" placeholder="Password" />
          <button type="submit">Continue</button>
        </form>
        <p id="pwerr" class="gate-err" hidden>Wrong password</p>
        <button type="button" id="signin" hidden>Sign in</button>
      </div>
    </div>
    <div id="app" class="app" hidden>
      <aside>
        <div class="aside-head">
          <div class="brand">
            <span class="mark"></span>
            <strong>pi-box</strong>
          </div>
          <div class="aside-actions">
            <button type="button" id="newbot" class="ghost" title="New bot">Bot</button>
            <button type="button" id="userbtn" class="ghost" title="Account">you</button>
          </div>
        </div>
        <p class="aside-label">bots</p>
        <nav id="roster"></nav>
        <div class="chats-head">
          <p class="aside-label">chats</p>
          <button type="button" id="newchat" class="ghost" title="New chat">New</button>
        </div>
        <nav id="chats"></nav>
        <div id="skill-list" class="skill-list"></div>
        <p class="aside-label">machines</p>
        <div id="machines"></div>
        <p class="machine-hint">Install pi-box on this computer and log in.</p>
        <footer class="aside-foot">
          <a href="/vault">vault</a>
          <a href="/plugins">plugins</a>
          <a href="/routines">routines</a>
        </footer>
      </aside>
      <section class="thread">
        <header>
          <div>
            <button type="button" id="show-bots" class="ghost">Bots</button>
            <strong id="box-name">select a bot</strong>
            <span class="sub" id="box-meta"></span>
            <span class="sub" id="box-runtime"></span>
          </div>
          <div class="status" id="status">idle</div>
          <button type="button" id="bot-settings" class="ghost">Settings</button>
          <a class="sub" href="/routines">routines</a>
        </header>
        <div id="computer-pane" hidden></div>
        <main id="log"></main>
        <form id="composer">
          <div id="pending-files" class="pending-files"></div>
          <div class="composer-row">
            <button type="button" id="attach" class="ghost" title="Attach files">Attach</button>
            <input id="file" type="file" multiple hidden />
            <textarea id="input" rows="1" placeholder="Message this box…"></textarea>
            <button type="button" id="stop" hidden>Stop</button>
            <button type="submit" id="send">Send</button>
          </div>
        </form>
      </section>
    </div>
    <div id="bot-sheet" class="sheet" hidden>
      <form id="bot-form" class="sheet-card">
        <div class="sheet-head">
          <h2 id="bot-sheet-title">Bot</h2>
          <button type="button" id="bot-sheet-close" class="ghost">Close</button>
        </div>
        <label class="field">
          <span>Name</span>
          <input id="bot-name" name="name" maxlength="80" required />
        </label>
        <label class="field">
          <span>Description</span>
          <input id="bot-description" name="description" maxlength="500" />
        </label>
        <div class="field">
          <span>Avatar</span>
          <div id="bot-colors" class="swatches"></div>
        </div>
        <label class="field">
          <span>Instructions</span>
          <textarea id="bot-instructions" name="instructions" rows="8" placeholder="Standing rules for this bot"></textarea>
        </label>
        <div class="sheet-actions">
          <button type="submit" id="bot-save">Save</button>
          <button type="button" id="bot-delete" class="ghost">Delete</button>
        </div>
        <h3>Memory</h3>
        <p class="lede">Profile facts stay in the prompt. Log facts are dated and searchable.</p>
        <div id="bot-memory"></div>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script src="/computer.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
